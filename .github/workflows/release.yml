# Releases with release-plz (see release-plz.toml). On every push to main it:
# - opens or updates the release PR, which bumps the versions, checks the public API for breaking
#   changes with cargo-semver-checks, and adds the changelog section;
# - when the push is that PR being merged, publishes to crates.io, tags `v<version>`, creates the
#   GitHub release from the changelog as a draft, runs the benchmarks for it, and then publishes
#   it. Releases are immutable once published, so the benchmark files go on while it's a draft.
#
# Publishing uses crates.io trusted publishing (no secret) once each crate exists there. The very
# first publish of a crate needs a `CARGO_REGISTRY_TOKEN` secret, removed afterwards.
name: release

on:
  push:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'sisaio'
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Publish and tag
        id: release
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # release-plz names a tag for every crate it published, in no documented order; the `v` tag
      # is core's.
      - name: Find the release tag
        id: tag
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag=$(jq -r '.[] | select(.package_name == "sisa-caching-core") | .tag' <<< "$RELEASES")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  bench:
    name: bench
    needs: release
    if: needs.release.outputs.tag
    permissions:
      contents: write
    uses: ./.github/workflows/bench.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # Publishes the draft even when the benchmarks fail, since the crates are already out.
  publish-release:
    name: publish release
    needs: [release, bench]
    if: always() && needs.release.outputs.tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  release-pr:
    name: release PR
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'sisaio'
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Open or update the release PR
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
