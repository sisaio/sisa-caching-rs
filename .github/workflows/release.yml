# Releases. It:
# - opens the release PR with release-plz (see release-plz.toml) when the maintainer runs this
#   workflow by hand, and updates it on every push to main while it is open. The PR bumps the
#   versions, checks the public API for breaking changes with cargo-semver-checks, and adds the
#   changelog section;
# - on a push to main whose version has no `v<version>` tag yet, as merging that PR brings: tags
#   the commit, creates the GitHub release from the changelog as a draft, runs the benchmarks for
#   it, waits for CI to pass on that commit and for the maintainer to approve the `release`
#   environment, publishes the crates to crates.io, and then publishes the release.
#
# crates.io is the one step nobody can undo, so it comes last, after the benchmark table is on the
# draft and someone has read it. Releases are immutable once published, so the release stays a
# draft until every crate is out. If crates.io rejects a crate, the tag stays: ship the fix as the
# next version, or have an admin delete the tag and the draft.
#
# Publishing uses the `CARGO_REGISTRY_TOKEN` secret while it is set, and crates.io trusted
# publishing from the `release` environment once it is deleted. A crate's very first publish
# needs the token.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tags the pushed commit and drafts its release, unless its version is tagged already. A push
  # while an earlier release waits for approval finds the tag and does nothing.
  tag:
    name: tag
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'sisaio' && github.event_name == 'push'
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag and draft the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag exists; nothing to release"
            exit 0
          fi
          # The changelog section for this version, without its heading.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          gh release create "$tag" --draft --verify-tag --title "$tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  bench:
    name: bench
    needs: tag
    if: needs.tag.outputs.tag
    permissions:
      contents: write
    uses: ./.github/workflows/bench.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  # The ci workflow's run for this exact commit must succeed. A failed or cancelled run, or none
  # within the timeout, stops the release before crates.io.
  ci:
    name: wait for CI
    needs: tag
    if: needs.tag.outputs.tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for the ci run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --json status,conclusion,url --jq 'first // empty')
            if [ -n "$run" ] && [ "$(jq -r .status <<< "$run")" = completed ]; then
              echo "$(jq -r .url <<< "$run"): $(jq -r .conclusion <<< "$run")"
              [ "$(jq -r .conclusion <<< "$run")" = success ]
              exit
            fi
            sleep 30
          done

  # Waits for the maintainer to approve the `release` environment, after reading the benchmark
  # table on the draft. It runs even when the benchmarks failed, so that call is theirs. Each crate
  # whose version crates.io already has is skipped, so a re-run finishes a half-done publish.
  publish:
    name: publish
    needs: [tag, bench, ci]
    if: always() && needs.tag.outputs.tag && needs.ci.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Get a crates.io token
        id: auth
        if: env.HAS_REGISTRY_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # In dependency order. cargo waits for each crate to show in the index before the next.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          for crate in sisa-caching-core sisa-caching-memory sisa-caching-redis sisa-caching-hybrid sisa-caching; do
            if curl -sfo /dev/null -A "sisa-caching-rs release (github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is on crates.io already"
            else
              cargo publish -p "$crate" --locked
            fi
          done

  publish-release:
    name: publish release
    needs: [tag, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # With the release app's secrets set, the PR is opened with the app's token, so GitHub runs CI
  # on it like on any other PR. Without them, it falls back to the built-in token, whose PRs get
  # no CI.
  release-pr:
    name: release PR
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'sisaio'
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr
      cancel-in-progress: false
    env:
      HAS_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      # A push only updates a release PR that is already open; opening one is the maintainer's call.
      - name: Check for an open release PR
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            count=$(gh pr list --repo "$GITHUB_REPOSITORY" --label release --state open --json number --jq length)
            echo "run=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the release app's token
        id: app
        if: steps.open.outputs.run == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.open.outputs.run == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain
        if: steps.open.outputs.run == 'true'
        run: rustup toolchain install

      - name: Open or update the release PR
        if: steps.open.outputs.run == 'true'
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
