# Releases. It:
# - opens the release PR with release-plz (see release-plz.toml) when the maintainer runs this
#   workflow by hand, and updates it after every push to main while it is open. The PR bumps the
#   versions, checks the public API for breaking changes with cargo-semver-checks, and adds the
#   changelog section;
# - once CI passes on a push to main whose version has no `v<version>` tag yet, as merging that PR
#   brings: tags the commit, creates the GitHub release from the changelog as a draft, runs the
#   benchmarks for it, waits for the maintainer to approve the `release` environment, publishes
#   the crates to crates.io, checks that crates.io serves the `.crate` files the tag packages to
#   and attaches them with a signed provenance attestation to the draft, and then publishes the
#   release.
#
# It starts when CI finishes on main rather than on the push, so a commit whose CI failed is never
# tagged. GitHub runs this file as it is on main, so a change to it takes effect once merged.
#
# crates.io is the one step nobody can undo, so it comes last, after the benchmark table is on the
# draft and someone has read it. Releases are immutable once published, so the release stays a
# draft until every crate is out. If crates.io rejects a crate, the tag stays: ship the fix as the
# next version, or have an admin delete the tag and the draft.
#
# Publishing uses the `CARGO_REGISTRY_TOKEN` secret while it is set, and crates.io trusted
# publishing from the `release` environment once it is deleted. A crate's very first publish
# needs the token.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tags the commit CI passed on and drafts its release, unless its version is tagged already. A
  # push while an earlier release waits for approval finds the tag on another commit and does nothing.
  # A rerun of a run that failed after tagging finds the tag on its own commit, with no published
  # release, and carries on from there.
  tag:
    name: tag
    runs-on: ubuntu-26.04
    # `branches` also matches a PR from a fork's main, so only CI runs for a push count.
    if: >-
      github.repository_owner == 'sisaio' && github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Main with its history. The job reads the files of the commit CI tested with `git show` and
      # runs none of its code; GITHUB_SHA is main's newest commit, which may be a later one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag and draft the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(git show "$SHA:Cargo.toml" |
            python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["workspace"]["package"]["version"])')
          tag="v$version"
          # `isDraft` of the version's release, or nothing when it has none.
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null || true)
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$SHA" ] || [ "$draft" = false ]; then
              echo "$tag exists; nothing to release"
              exit 0
            fi
            echo "$tag is on this commit and not released yet; carrying on"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
          fi
          if [ -z "$draft" ]; then
            # The changelog section for this version, without its heading.
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' <(git show "$SHA:CHANGELOG.md") > notes.md
            # A version such as 0.4.0-rc.1 is a pre-release, which GitHub never marks as the latest.
            prerelease=()
            if [[ $version == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$tag" --draft "${prerelease[@]}" --verify-tag --title "$tag" \
              --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  bench:
    name: bench
    needs: tag
    if: needs.tag.outputs.tag
    permissions:
      contents: write
    uses: ./.github/workflows/bench.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  # Waits for the maintainer to approve the `release` environment, after reading the benchmark
  # table on the draft. It runs even when the benchmarks failed, so that call is theirs. Each crate
  # whose version crates.io already has is skipped, so a re-run finishes a half-done publish.
  publish:
    name: publish
    needs: [tag, bench]
    if: always() && needs.tag.outputs.tag
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Get a crates.io token
        id: auth
        if: env.HAS_REGISTRY_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # In dependency order. cargo waits for each crate to show in the index before the next.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          for crate in sisa-caching-core sisa-caching-memory sisa-caching-redis sisa-caching-hybrid sisa-caching; do
            if curl -sfo /dev/null -A "sisa-caching-rs release (github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is on crates.io already"
            else
              cargo publish -p "$crate" --locked
            fi
          done

  # Signs what users download, once it matches the tagged source: it packages each crate from the
  # tag, as `cargo publish` did, and fails unless crates.io serves the same bytes, so a crate
  # uploaded any other way gets no attestation. `.crate` files are reproducible. The attestation
  # is a Sigstore bundle with SLSA build provenance, also listed under the repository's
  # attestations. It goes on the draft, since a published release can't change.
  attest:
    name: attest
    needs: [tag, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      # The downloads go outside the checkout, which has a `crates/` folder of its own.
      - name: Check the published crates against the tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          OUT: ${{ runner.temp }}/release-crates
        run: |
          version="${TAG#v}"
          mkdir -p "$OUT"
          for crate in sisa-caching-core sisa-caching-memory sisa-caching-redis sisa-caching-hybrid sisa-caching; do
            cargo package -p "$crate" --locked --no-verify
            curl -sSfL -A "sisa-caching-rs release (github.com/$GITHUB_REPOSITORY)" \
              -o "$OUT/$crate-$version.crate" "https://static.crates.io/crates/$crate/$crate-$version.crate"
            cmp "target/package/$crate-$version.crate" "$OUT/$crate-$version.crate"
          done

      - name: Attest the crates
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-crates/*.crate

      - name: Attach them to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          OUT: ${{ runner.temp }}/release-crates
        run: |
          cp "$BUNDLE" "$OUT/sisa-caching-${TAG#v}.sigstore.json"
          gh release upload "$TAG" "$OUT"/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    name: publish release
    needs: [tag, attest]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # With the release app's secrets set, the PR is opened with the app's token, so GitHub runs CI
  # on it like on any other PR. Without them, it falls back to the built-in token, whose PRs get
  # no CI.
  release-pr:
    name: release PR
    runs-on: ubuntu-26.04
    if: >-
      github.repository_owner == 'sisaio'
      && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr
      cancel-in-progress: false
    env:
      HAS_APP: ${{ secrets.RELEASE_APP_ID != '' }}
    steps:
      # A push only updates a release PR that is already open; opening one is the maintainer's call.
      - name: Check for an open release PR
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The REST list, not `gh pr list --label`, which reads the search index and misses a new PR.
          branch=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq 'map(select(any(.labels[]; .name == "release"))) | first.head.ref // empty')
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -n "$branch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the release app's token
        id: app
        if: steps.open.outputs.run == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.open.outputs.run == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain
        if: steps.open.outputs.run == 'true'
        run: rustup toolchain install

      - name: Open or update the release PR
        if: steps.open.outputs.run == 'true'
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
