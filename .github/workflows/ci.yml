# Formatting, lints, the MSRV build, the dependency policy, breaking API changes, the Markdown
# links, the tests, which run against Redis 7.4, Redis 8, Valkey 8, Dragonfly 2 and Garnet 2, and
# coverage on main. The Redis tests start their servers in Docker. PRs and pushes to main that
# change no Rust inputs skip the Rust jobs; `ci` sums them up for the ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Whether the Rust jobs need to run, and the commit check every PR needs. A PR is diffed against
  # its base and a push to main against the commit before it, so a docs-only merge skips them too.
  # A merge with the same files as its PR's head, which passed CI, skips them as well; coverage
  # still runs on every code change, for the badge. `semver` runs only when a published crate's
  # source or manifest, the lock file, the toolchain or this workflow changes: tests, benches and
  # examples have no public API.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      coverage: ${{ steps.diff.outputs.coverage }}
      api: ${{ steps.diff.outputs.api }}
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so both checks can read the pushed commits.
          fetch-depth: 0

      - name: Look for code changes
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(.github/scripts/code-changed.sh "$BASE" "$HEAD")
          echo "coverage=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ] && [ "$GITHUB_EVENT_NAME" = push ] \
            && [ "$(.github/scripts/pr-tested.sh "$BASE" "$HEAD")" = true ]; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          api=false
          if git diff --name-only "$BASE...$HEAD" | grep -qE \
            '^crates/(core|memory|redis|hybrid|sisa-caching)/(src/|Cargo\.toml$)|^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.github/workflows/ci\.yml)$'; then
            api=true
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"

      # The PR's commits and title against CONTRIBUTING.md#commit-messages. A title edited later is
      # checked on the next push. Dependabot's titles run long, so its PRs are left out.
      - name: Check commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            .githooks/commit-msg "$RUNNER_TEMP/message" || status=1
          done
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/message"
          .githooks/commit-msg "$RUNNER_TEMP/message" || status=1
          exit "$status"

  # On ARM, which builds faster; the jobs that run our code stay on x64, where most users are.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      # Restores ~/.cargo and target/ from main's last run. Only main saves, so PRs don't fill the
      # cache quota. The other jobs below do the same.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The `tls-rustls` feature changes some redis-rs signatures, so lint with it on too.
      - name: Run Clippy with every feature
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # With `tls-rustls` on too, redis-rs uses rustls, so the native-tls tests only build alone.
      - name: Run Clippy with native-tls
        run: cargo clippy -p sisa-caching-redis -p sisa-caching-hybrid --all-targets --features tls-native-tls --locked -- -D warnings

      # Alone, so the workspace's other members don't turn its features on.
      - name: Build the facade with each feature
        run: |
          for features in "" memory redis hybrid tls-rustls tls-native-tls; do
            cargo check -p sisa-caching --features "$features" --locked
          done

      # docs.rs builds every published crate with every feature; a broken link fails here instead.
      - name: Build the docs
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The workspace `rust-version`.
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.89 --profile minimal

      # Keyed on the MSRV compiler; the default from rust-toolchain.toml isn't installed here.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          RUSTUP_TOOLCHAIN: "1.89"
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build at the MSRV
        run: cargo +1.89 check --workspace --all-targets --all-features --locked

  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Advisories, licenses, bans and sources, as deny.toml sets them.
      - name: Check the dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # A change that breaks a published crate's API, against the PR's base, fails unless the PR
  # carries the `breaking` label. The base rather than crates.io, so that a break already merged
  # for the next release doesn't fail every later PR. The label is read when the job runs, so after
  # adding it, re-run the job.
  semver:
    name: semver
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for the breaking label
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          breaking=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq 'any(.labels[]; .name == "breaking")')
          echo "breaking=$breaking" >> "$GITHUB_OUTPUT"

      - name: Install the pinned toolchain
        if: steps.label.outputs.breaking != 'true'
        run: rustup toolchain install

      - name: Install cargo-semver-checks
        if: steps.label.outputs.breaking != 'true'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-semver-checks

      # Every published crate with every feature; `--workspace` skips the unpublished ones. Each
      # crate is built twice, as it is and at the base, and on its own cargo-semver-checks gives
      # every build a target dir of its own. One shared dir builds the dependencies once instead of
      # six times, which takes the job from about 4 minutes to 1.
      - name: Check the public API
        if: steps.label.outputs.breaking != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/semver
        run: cargo semver-checks --workspace --all-features --baseline-rev "$BASE"

  # Relative links and #anchors in the Markdown files, hidden folders such as .agents and .github
  # included; .claude only links to .agents. External links stay out, since they flake; rustdoc
  # checks the links in doc comments.
  links:
    name: links
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: lychee

      - name: Check the links
        run: lychee --offline --include-fragments --no-progress --hidden --exclude-path '(^|/)(\.git|\.claude|target)/' './**/*.md'

  test:
    name: test (${{ matrix.server }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Dragonfly publishes no tag that follows its major version, so it is pinned.
        server:
          - redis:7.4-alpine
          - redis:8-alpine
          - valkey/valkey:8-alpine
          - ghcr.io/dragonflydb/dragonfly:v2.0.2
          - ghcr.io/microsoft/garnet:2
    env:
      REDIS_IMAGE: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Pulled once here, so no test waits on the download.
      - name: Pull the server image
        run: docker pull "$REDIS_IMAGE"

      # Every feature, so the TLS tests run on `tls-rustls`'s own crypto provider. Only the Redis
      # and hybrid crates talk to the server, so the rest of the workspace, its doctests among
      # them, runs on one server.
      - name: Run all tests including Redis
        if: matrix.server == 'redis:8-alpine'
        run: cargo test --workspace --all-features --locked

      - name: Run the Redis and hybrid tests
        if: matrix.server != 'redis:8-alpine'
        run: cargo test -p sisa-caching-redis -p sisa-caching-hybrid --all-features --locked

      - name: Run the native-tls tests
        run: cargo test -p sisa-caching-redis -p sisa-caching-hybrid --features tls-native-tls --test native_tls --locked

  # The check the main ruleset requires: skipped jobs pass, failed or cancelled ones fail. A skipped
  # matrix job reports no `test (...)` check, so those can't be required directly.
  ci:
    name: ci
    if: always()
    needs: [changes, lint, msrv, deny, semver, links, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Line coverage for the README badge, on main only to keep Actions minutes down. One server is
  # enough: the other servers run the same code paths. The test helpers crate is left out.
  coverage:
    name: coverage
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      REDIS_IMAGE: redis:8-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov

      - name: Pull the server image
        run: docker pull "$REDIS_IMAGE"

      - name: Measure coverage
        run: cargo llvm-cov --workspace --all-features --locked --ignore-filename-regex 'crates/testing/' --lcov --output-path lcov.info

      # A Codecov outage only leaves the badge stale; it doesn't turn main red, which would hold up
      # a release waiting on this run.
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
