# CodeQL advanced setup for the Rust code and the GitHub Actions workflows. A PR gets the Actions
# scan only, which takes under a minute. The Rust scan takes about five, longer than all of CI, so
# it runs after the merge, on each push to main that changes a Rust input, and every week; its
# findings show under Security → Code scanning. The `main` ruleset requires `analyze (actions)`
# and not `analyze (rust)`, which a PR never reports.
#
# The same file in every sisaio crate repository.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      # A private repository's analysis reads its own workflow run.
      actions: read
      contents: read
      security-events: write
    # The Rust extractor's cargo commands build into target/, so the cache below applies.
    env:
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(github.event_name == 'pull_request' && '["actions"]' || '["actions", "rust"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the next step can diff the push against the commit before it.
          fetch-depth: 0

      # A push to main is diffed against the commit before it: one that changes no Rust inputs
      # skips the Rust scan. The Actions scan always runs, so every PR gets the `CodeQL` check
      # that Scorecard's SAST check counts. The weekly run scans both.
      - name: Look for changes to scan
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            scan=true
          elif [ "$LANGUAGE" = rust ]; then
            scan=$(.github/scripts/code-changed.sh "$BASE" "$HEAD")
          else
            scan=true
          fi
          echo "scan=$scan" >> "$GITHUB_OUTPUT"

      # The Rust extractor reads the Cargo manifests and runs build scripts and procedural macros.
      - name: Install the pinned toolchain
        if: matrix.language == 'rust' && steps.scope.outputs.scan == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.language == 'rust' && steps.scope.outputs.scan == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: steps.scope.outputs.scan == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: steps.scope.outputs.scan == 'true'
        with:
          category: /language:${{ matrix.language }}
