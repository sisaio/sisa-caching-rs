# CodeQL advanced setup for the Rust code and the GitHub Actions workflows.
name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # A private repository's analysis reads its own workflow run.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the next step can diff the PR against its base.
          fetch-depth: 0

      # PRs that change no Rust inputs skip the Rust scan but still report `analyze (rust)`.
      - name: Look for code changes
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$LANGUAGE" = rust ]; then
            echo "scan=$(.github/scripts/code-changed.sh "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi

      # The Rust extractor reads the Cargo manifests and runs build scripts and procedural macros.
      - name: Install the pinned toolchain
        if: matrix.language == 'rust' && steps.scope.outputs.scan == 'true'
        run: rustup toolchain install

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.scope.outputs.scan == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.scope.outputs.scan == 'true'
        with:
          category: /language:${{ matrix.language }}
