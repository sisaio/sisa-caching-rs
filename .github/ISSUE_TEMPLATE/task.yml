name: Task
description: Planned work the maintainers have agreed to do.
type: Task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this work achieves, and why now.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in, and what is left out on purpose.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true to close this task, one checkbox each.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Related issues, PRs, roadmap items or docs pages.
