# The dependency policy that `cargo deny check` enforces: advisories, licenses, bans, and sources.
# Adding a license, an advisory exception, or a source needs a reviewed reason beside it.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  # Boost Software License, used by xxhash-rust through redis.
  "BSL-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
