[package]
name = "axum-hybrid"
description = "The users API on the hybrid cache, run as several instances"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
users-api = { path = "../users-api" }
sisa-caching = { workspace = true, features = ["hybrid"] }

tokio = { workspace = true, features = ["rt-multi-thread"] }
